  <script>
    (function() {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let w, h, t = 0;
      const lines = [];
      const LINE_COUNT = 7;
      const PALETTE = ['rgba(99,102,241,0.12)','rgba(168,85,247,0.10)','rgba(236,72,153,0.09)','rgba(59,130,246,0.11)','rgba(34,197,94,0.08)','rgba(245,158,11,0.09)','rgba(6,182,212,0.10)'];
      function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize); resize();
      for (let i = 0; i < LINE_COUNT; i++) { lines.push({ color: PALETTE[i % PALETTE.length], amplitude: 40 + Math.random() * 60, frequency: 0.002 + Math.random() * 0.003, phase: Math.random() * Math.PI * 2, speed: 0.003 + Math.random() * 0.004, yBase: (i + 1) / (LINE_COUNT + 1), thickness: 1.5 + Math.random() * 2 }); }
      function draw() {
        ctx.clearRect(0, 0, w, h);
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#F8FAFC'); grad.addColorStop(0.5, '#EEF2FF'); grad.addColorStop(1, '#F5F3FF');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        for (const line of lines) {
          ctx.beginPath(); ctx.strokeStyle = line.color; ctx.lineWidth = line.thickness;
          const yCenter = line.yBase * h;
          for (let x = 0; x <= w; x += 2) {
            const y = yCenter + Math.sin(x * line.frequency + t * line.speed + line.phase) * line.amplitude + Math.sin(x * line.frequency * 0.5 + t * line.speed * 0.7 + line.phase * 1.3) * line.amplitude * 0.5;
            if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
        t++; requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>

    ];

    // ===== SEQUENCE + GATING CONFIG =====
    const WINDOW = 12; // ~ a dozen unmastered games open at once
    const RETENTION_DAYS = 7;
    const BUCKET = { "Series 11":2, "Series 12":3, "Equivalence 13":4, "Equivalence 14":5, "Transformation 13":6, "Transformation 14":7, "Skills":8 };
    const BUCKET_LABEL = ["Core Sequence","Extended (P11-P32)","Series 11","Series 12","Equivalence 13","Equivalence 14","Transformation 13","Transformation 14","Skills"];
    function bucketIndex(p) {
      if (/^p([1-9]|10)$/.test(p.id)) return 0;
      if (/^p(1[1-9]|2[0-9]|3[0-2])$/.test(p.id)) return 1;
      return BUCKET[p.category] !== undefined ? BUCKET[p.category] : 9;
    }
    function natKey(p) {
      const m = p.id.match(/^([a-z]+)(\d+)([a-z]*)(\d*)$/);
      const num = m ? parseInt(m[2] || "0", 10) : 0;
      const lett = m ? m[3] : "";
      const sub = m ? parseInt(m[4] || "0", 10) : 0;
      return [bucketIndex(p), num, lett, sub];
    }
    const SEQ = [...PROGRAMS].sort((a, b) => {
      const ka = natKey(a), kb = natKey(b);
      for (let i = 0; i < ka.length; i++) { if (ka[i] < kb[i]) return -1; if (ka[i] > kb[i]) return 1; }
      return 0;
    });

    function gameLabel(num) { return /^\d/.test(String(num)) ? "P" + num : String(num); }
    function isMastered(progress, id) { return !!(progress.programs[id] && progress.programs[id].mastery); }
    function lastPlayed(progress, id) {
      const s = (progress.programs[id] && progress.programs[id].sessions) || [];
      return s.length ? new Date(s[s.length - 1].date).getTime() : 0;
    }

    // ===== UNLOCKED allowlist =====
    // Games vetted and online today are always unlocked; everything else is locked
    // until vetted (add its id here). Overlap resolves to unlocked.
    // Seed: live numbered set P1-P32 plus the validated Series-12 set (p12m-p12v).
    const UNLOCKED_IDS = new Set([
      ...Array.from({length:32},(_,i)=>"p"+(i+1)),
      "p12m","p12n","p12o","p12p","p12q","p12r","p12s","p12t","p12u","p12v",
    ]);

    // Status: 'mastered' | 'open' | 'locked'. Open = on the allowlist (or mastered).
    // Locked = not yet vetted/online. As games are vetted, add their id to UNLOCKED_IDS.
    function computeStatus(progress) {
      const status = {};
      SEQ.forEach((p) => {
        if (isMastered(progress, p.id)) status[p.id] = "mastered";
        else if (UNLOCKED_IDS.has(p.id)) status[p.id] = "open";
        else status[p.id] = "locked";
      });
      return status;
    }
    function retentionPicks(progress, status, n) {
      const now = Date.now();
      const mastered = SEQ.filter(p => status[p.id] === "mastered");
      const due = mastered.map(p => ({ p, last: lastPlayed(progress, p.id) }))
        .filter(x => now - x.last > RETENTION_DAYS * 86400000)
        .sort((a, b) => a.last - b.last);
      return due.slice(0, n).map(x => x.p);
    }

    // ===== CATEGORIES (derived dynamically from the array) =====
    const CAT_COLORS = { "Translation":"#22C55E","Equivalence":"#8B5CF6","Abstraction":"#2563EB","Inference":"#DC2626","Social":"#0D9488","Language":"#6D28D9","Transformation":"#EA580C","Series 11":"#0EA5E9","Series 12":"#14B8A6","Equivalence 13":"#6366F1","Equivalence 14":"#8B5CF6","Transformation 13":"#F97316","Transformation 14":"#EC4899","Skills":"#10B981" };
    const CATEGORIES = (() => {
      const seen = []; const order = {};
      SEQ.forEach(p => { if (order[p.category] === undefined) { order[p.category] = seen.length; seen.push(p.category); } });
      return seen.map(name => ({ name, color: CAT_COLORS[name] || "#64748B" }));
    })();

    // ===== ACHIEVEMENTS (thresholds scale to full suite) =====
    const TOTAL = PROGRAMS.length;
    const masteredN = (p) => Object.values(p.programs).filter(x => x.mastery).length;
    const triedN = (p) => Object.keys(p.programs).length;
    const ACHIEVEMENTS = [
      { id:"first_steps", emoji:"👣", title:"First Steps", desc:"Complete your first session", check:(p)=>p.totalSessions>=1 },
      { id:"explorer", emoji:"🗺️", title:"Explorer", desc:"Try 10 different games", check:(p)=>triedN(p)>=10 },
      { id:"twenty_five_sess", emoji:"💎", title:"Quarter Century", desc:"Complete 25 sessions", check:(p)=>p.totalSessions>=25 },
      { id:"fifty_sess", emoji:"🎯", title:"Fifty Strong", desc:"Complete 50 sessions", check:(p)=>p.totalSessions>=50 },
      { id:"five_streak", emoji:"🔥", title:"On Fire", desc:"5-day play streak", check:(p)=>p.streak.best>=5 },
      { id:"mastery_1", emoji:"🥇", title:"First Mastery", desc:"Master any game", check:(p)=>masteredN(p)>=1 },
      { id:"mastery_10", emoji:"💫", title:"Ten Strong", desc:"Master 10 games", check:(p)=>masteredN(p)>=10 },
      { id:"mastery_25", emoji:"🏆", title:"Twenty-Five Mastered", desc:"Master 25 games", check:(p)=>masteredN(p)>=25 },
      { id:"mastery_half", emoji:"⭐", title:"Halfway", desc:"Master half the suite", check:(p)=>masteredN(p)>=Math.ceil(TOTAL/2) },
      { id:"mastery_all", emoji:"👑", title:"FrameShift Master", desc:"Master every game", check:(p)=>masteredN(p)>=TOTAL },
    ];

    // ===== UI ATOMS =====
    const Stars = ({ count }) => (
      <div className="flex gap-0.5">{[0,1,2].map(i => (<span key={i} className={"text-sm " + (i < count ? "star-gold" : "text-gray-300")}>★</span>))}</div>
    );

    const ProgramCard = ({ program, status, index, bonus }) => {
      const locked = status === "locked";
      const mastered = status === "mastered";
      const cls = locked ? "card-locked" : mastered ? "card-muted" : "";
      const inner = (
        <div className={"anim-fadein block rounded-2xl glass card-shadow border border-white border-opacity-60 p-4 relative overflow-hidden " + (locked ? "" : "hover:scale-[1.03] transition-all duration-200 group ") + (bonus ? "bonus-ring " : "")} style={{ animationDelay: (index*0.03) + "s" }}>
          {mastered && !bonus && <div className="absolute inset-0 anim-shimmer rounded-2xl pointer-events-none" />}
          <div className="flex items-start gap-3">
            <div className="mastery-ring" style={{ "--ring-color": program.color, "--ring-pct": (mastered?"100%":bonus?"100%":"0%"), width:48, height:48 }}>
              <div className="bg-white rounded-full w-full h-full flex items-center justify-center"><span className="text-lg">{program.emoji}</span></div>
            </div>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2">
                <span className="fredoka text-xs font-bold text-gray-400">{gameLabel(program.num)}</span>
                {!locked && <Stars count={mastered ? 3 : 1} />}
                {locked && <span className="text-xs nunito px-2 py-0.5 rounded-full lockbadge">🔒 Locked</span>}
                {bonus && <span className="text-xs nunito px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 font-bold">★ Bonus</span>}
              </div>
              <h3 className={"fredoka text-base font-bold truncate " + (locked ? "text-gray-400" : "text-gray-800 group-hover:text-indigo-700")}>{program.title}</h3>
              <p className="nunito text-xs text-gray-500">{program.subtitle}</p>
              {mastered && !bonus && <span className="inline-block mt-1 text-xs nunito px-2 py-0.5 rounded-full bg-green-100 text-green-700 font-bold">✓ Mastered</span>}
            </div>
          </div>
        </div>
      );
      if (locked) return <div>{inner}</div>;
      return <a href={program.file}>{inner}</a>;
    };

    const Section = ({ title, hint, children, defaultOpen=true, count }) => {
      const [open, setOpen] = useState(defaultOpen);
      return (
        <div className="mb-6">
          <button onClick={()=>setOpen(!open)} className="w-full flex items-center gap-2 mb-3 text-left">
            <span className="fredoka text-lg font-bold text-gray-700">{title}</span>
            {count !== undefined && <span className="nunito text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-600">{count}</span>}
            {hint && <span className="nunito text-xs text-gray-400">{hint}</span>}
            <span className="ml-auto text-gray-400 text-sm">{open ? "▾" : "▸"}</span>
          </button>
          {open && children}
        </div>
      );
    };

    const Grid = ({ items, status, bonusIds }) => (
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
        {items.map((prog, i) => (<ProgramCard key={prog.id} program={prog} status={status[prog.id]} index={i} bonus={bonusIds && bonusIds.has(prog.id)} />))}
      </div>
    );

    const OverviewStats = ({ progress, status }) => {
      const openNow = SEQ.filter(p => status[p.id] === "open").length;
      const stats = [
        { label:"Sessions", value: progress.totalSessions, emoji:"📊" },
        { label:"Mastered", value: masteredN(progress) + "/" + TOTAL, emoji:"⭐" },
        { label:"Open Now", value: openNow, emoji:"🎮" },
        { label:"Day Streak", value: progress.streak.current, emoji:"🔥" },
        { label:"Achievements", value: ACHIEVEMENTS.filter(a=>a.check(progress)).length + "/" + ACHIEVEMENTS.length, emoji:"🏅" },
      ];
      return (
        <div className="grid grid-cols-5 gap-2 sm:gap-3">
          {stats.map((s,i)=>(
            <div key={i} className="glass rounded-xl p-3 card-shadow border border-white border-opacity-60 text-center anim-fadein" style={{animationDelay:(i*0.06)+"s"}}>
              <div className="text-xl mb-0.5">{s.emoji}</div>
              <div className="fredoka text-lg sm:text-xl font-bold text-gray-800">{s.value}</div>
              <div className="nunito text-[10px] sm:text-xs text-gray-500">{s.label}</div>
            </div>
          ))}
        </div>
      );
    };

    const CategoryProgress = ({ progress }) => (
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2">
        {CATEGORIES.map(cat => {
          const progs = PROGRAMS.filter(p => p.category === cat.name);
          const mastered = progs.filter(p => isMastered(progress, p.id)).length;
          const pct = Math.round((mastered / progs.length) * 100);
          return (
            <div key={cat.name} className="glass rounded-xl px-3 py-2 card-shadow border border-white border-opacity-60">
              <div className="flex items-center gap-1.5 mb-1">
                <div className="w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: cat.color }} />
                <span className="fredoka text-xs text-gray-700 font-bold truncate">{cat.name}</span>
              </div>
              <div className="w-full bg-gray-200 rounded-full h-1.5 overflow-hidden"><div className="h-full rounded-full transition-all duration-700" style={{ width: pct + "%", backgroundColor: cat.color }} /></div>
              <div className="nunito text-[10px] text-gray-500 mt-0.5">{mastered}/{progs.length} mastered</div>
            </div>
          );
        })}
      </div>
    );

    const AchievementBadge = ({ achievement, earned }) => (
      <div className={"flex items-center gap-3 p-3 rounded-xl transition-all " + (earned ? "glass card-shadow border border-white border-opacity-60" : "bg-gray-100 bg-opacity-50 border border-gray-200 opacity-50")}>
        <span className={"text-2xl " + (earned ? "anim-badgepop" : "grayscale opacity-40")}>{achievement.emoji}</span>
        <div className="flex-1 min-w-0">
          <h4 className={"fredoka text-sm font-bold " + (earned ? "text-gray-800" : "text-gray-400")}>{achievement.title}</h4>
          <p className={"nunito text-xs " + (earned ? "text-gray-600" : "text-gray-400")}>{achievement.desc}</p>
        </div>
        {earned && <span className="text-green-500 text-sm">✓</span>}
      </div>
    );

    // ===== MAIN APP =====
    const FrameShiftHub = () => {
      const [progress, setProgress] = useState(defaultProgress());
      const [tab, setTab] = useState("games");
      const [showReset, setShowReset] = useState(false);

      useEffect(() => {
        setProgress(loadProgress());
        const handler = () => setProgress(loadProgress());
        window.addEventListener("storage", handler);
        window.addEventListener("focus", handler);
        return () => { window.removeEventListener("storage", handler); window.removeEventListener("focus", handler); };
      }, []);

      const status = useMemo(() => computeStatus(progress), [progress]);
      const openGames = useMemo(() => SEQ.filter(p => status[p.id] === "open"), [status]);
      const masteredGames = useMemo(() => SEQ.filter(p => status[p.id] === "mastered"), [status]);
      const lockedGames = useMemo(() => SEQ.filter(p => status[p.id] === "locked"), [status]);
      const bonus = useMemo(() => retentionPicks(progress, status, 3), [progress, status]);
      const bonusIds = new Set(bonus.map(p => p.id));

      const handleReset = () => { localStorage.removeItem(STORAGE_KEY); setProgress(defaultProgress()); setShowReset(false); };
      const earned = ACHIEVEMENTS.filter(a => a.check(progress));
      const unearned = ACHIEVEMENTS.filter(a => !a.check(progress));

      return (
        <div className="min-h-screen p-4 sm:p-6 lg:p-8">
          <div className="max-w-6xl mx-auto">
            <header className="text-center mb-6 anim-fadein">
              <h1 className="fredoka text-5xl sm:text-6xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 via-purple-500 to-pink-500">FrameShift</h1>
              <p className="nunito text-gray-500 text-sm sm:text-base max-w-lg mx-auto">Relational Frame Training Suite — {TOTAL} games, unlocking as you master each step</p>
              <p className="nunito text-xs text-gray-400 mt-1">Syntopic Systems</p>
            </header>

            <div className="mb-5"><OverviewStats progress={progress} status={status} /></div>
            <div className="mb-5"><CategoryProgress progress={progress} /></div>

            <div className="flex gap-2 justify-center mb-5">
              {[{key:"games",label:"🎮 Play"},{key:"achievements",label:"🏅 Achievements",count:earned.length},{key:"tracker",label:"📊 Session Log",count:progress.totalSessions}].map(t => (
                <button key={t.key} onClick={()=>setTab(t.key)} className={"px-4 py-2 rounded-xl fredoka text-sm font-bold transition-all " + (tab===t.key ? "glass card-shadow text-indigo-700 border border-indigo-200" : "text-gray-400 hover:text-gray-600 hover:bg-white hover:bg-opacity-40")}>
                  {t.label}{t.count!==undefined && t.count>0 && <span className="ml-1.5 px-1.5 py-0.5 bg-indigo-100 text-indigo-600 rounded-full text-xs">{t.count}</span>}
                </button>
              ))}
            </div>

            {tab === "games" && (
              <div>
                {bonus.length > 0 && (
                  <Section title="★ Keep Sharp" hint="bonus rounds — revisit a mastered game for retention" count={bonus.length}>
                    <Grid items={bonus} status={status} bonusIds={bonusIds} />
                  </Section>
                )}
                <Section title="Open Now" hint="your current set — master these to unlock more" count={openGames.length}>
                  {openGames.length > 0 ? <Grid items={openGames} status={status} /> : <p className="nunito text-sm text-gray-400">All open games mastered. New games will unlock as progress saves.</p>}
                </Section>
                {masteredGames.length > 0 && (
                  <Section title="Completed" count={masteredGames.length} defaultOpen={false}>
                    <Grid items={masteredGames} status={status} />
                  </Section>
                )}
                {lockedGames.length > 0 && (
                  <Section title="Locked" hint="unlock by mastering earlier games" count={lockedGames.length} defaultOpen={false}>
                    <Grid items={lockedGames} status={status} />
                  </Section>
                )}
              </div>
            )}

            {tab === "achievements" && (
              <div>
                {earned.length > 0 && (<div className="mb-4"><h3 className="fredoka text-lg text-gray-700 mb-2">🏅 Earned</h3><div className="grid grid-cols-1 sm:grid-cols-2 gap-2">{earned.map(a=>(<AchievementBadge key={a.id} achievement={a} earned={true} />))}</div></div>)}
                <div><h3 className="fredoka text-lg text-gray-400 mb-2">🔒 Locked</h3><div className="grid grid-cols-1 sm:grid-cols-2 gap-2">{unearned.map(a=>(<AchievementBadge key={a.id} achievement={a} earned={false} />))}</div></div>
              </div>
            )}

            {tab === "tracker" && (
              <div className="glass rounded-2xl p-5 card-shadow border border-white border-opacity-60">
                <h3 className="fredoka text-lg text-gray-700 mb-3">📊 Session History</h3>
                {Object.keys(progress.programs).length === 0 ? (<p className="nunito text-gray-400 text-center py-8">No sessions yet. Launch a game to begin.</p>) : (
                  <div className="space-y-2">
                    {SEQ.map(prog => {
                      const pd = progress.programs[prog.id];
                      if (!pd || !pd.sessions || pd.sessions.length === 0) return null;
                      return (
                        <div key={prog.id} className="bg-white bg-opacity-60 rounded-xl p-3 border border-gray-100">
                          <div className="flex items-center gap-2 mb-2"><span className="text-lg">{prog.emoji}</span><span className="fredoka text-sm font-bold text-gray-700">{gameLabel(prog.num)}: {prog.title}</span>{pd.mastery && <span className="text-xs nunito px-2 py-0.5 rounded-full bg-green-100 text-green-700 font-bold">Mastered</span>}</div>
                          <div className="space-y-1">{pd.sessions.slice(-5).reverse().map((s,i)=>(
                            <div key={i} className="flex justify-between items-center nunito text-xs text-gray-600 bg-gray-50 rounded-lg px-3 py-1.5">
                              <span>{new Date(s.date).toLocaleDateString()}</span>
                              <div className="flex gap-3">{s.trainScore!==undefined && <span>Train: <strong>{s.trainScore}/{s.trainMax}</strong></span>}{s.testScore!==undefined && s.testScore!==null && <span>Test: <strong className="text-purple-600">{s.testScore}/{s.testMax}</strong></span>}</div>
                            </div>))}</div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            <footer className="mt-8 text-center">
              <div className="nunito text-xs text-gray-400 space-x-4">
                <span>FrameShift RFT Suite v3.0</span><span>·</span><span>Syntopic Systems</span><span>·</span>
                <button onClick={()=>setShowReset(true)} className="text-gray-400 hover:text-red-400 transition-colors underline">Reset / Recalibrate Progress</button>
              </div>
              {showReset && (
                <div className="mt-3 glass rounded-xl p-4 inline-block card-shadow border border-red-200 anim-fadein">
                  <p className="nunito text-sm text-gray-700 mb-2">This clears all saved progress and mastery, resetting the unlock frontier to the first {WINDOW} games. Use this after games are updated to fix stale mastery flags.</p>
                  <div className="flex gap-2 justify-center">
                    <button onClick={handleReset} className="px-4 py-1.5 rounded-lg bg-red-500 text-white fredoka text-sm hover:bg-red-600">Yes, Reset</button>
                    <button onClick={()=>setShowReset(false)} className="px-4 py-1.5 rounded-lg bg-gray-200 text-gray-700 fredoka text-sm hover:bg-gray-300">Cancel</button>
                  </div>
                </div>
              )}
            </footer>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<FrameShiftHub />);
  </script>
</body>
</html>
