<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrameShift — Pattern Swap</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:#060d1a;color:#ddeeff;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Fredoka',sans-serif}
.frameshift-back{position:fixed;top:16px;left:16px;z-index:100;text-decoration:none;color:#60a5fa;font-family:'Fredoka',sans-serif;font-size:1.1rem;opacity:0.8;transition:opacity 0.2s}
.frameshift-back:hover{opacity:1}
.phase-tag{display:inline-block;padding:3px 14px;border-radius:10px;font-size:0.75rem;font-family:'Fredoka',sans-serif;font-weight:700;margin-bottom:10px}
.tag-train{background:rgba(96,165,250,0.18);color:#60a5fa;border:1px solid #60a5fa}
.tag-test{background:rgba(52,211,153,0.18);color:#34d399;border:1px solid #34d399}
</style>
</head>
<body>
<a href="index.html" class="frameshift-back">← FrameShift</a>
<div id="root"></div>
<script>
window.FrameShift={STORAGE_KEY:"frameshift_progress",load:function(){try{var d=localStorage.getItem(this.STORAGE_KEY);return d?JSON.parse(d):{};}catch(e){return{};}},save:function(d){try{localStorage.setItem(this.STORAGE_KEY,JSON.stringify(d));}catch(e){}},saveSession:function(p,ts,tm,xs,xm,m){var d=this.load();if(!d[p])d[p]={sessions:[]};d[p].sessions.push({date:new Date().toISOString(),train:{score:ts,max:tm},test:xs!==null?{score:xs,max:xm}:null,mastery:m||false});if(m)d[p].mastered=true;this.save(d);}};
var ac_ctx=null;function ac(){if(!ac_ctx)ac_ctx=new(window.AudioContext||window.webkitAudioContext)();return ac_ctx;}
function playTone(t){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0.12,c.currentTime);if(t==='correct'){o.frequency.setValueAtTime(523,c.currentTime);o.frequency.setValueAtTime(659,c.currentTime+0.1);o.frequency.setValueAtTime(784,c.currentTime+0.2);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.4);o.start();o.stop(c.currentTime+0.4);}else if(t==='incorrect'){o.frequency.setValueAtTime(200,c.currentTime);o.frequency.setValueAtTime(180,c.currentTime+0.15);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.3);o.start();o.stop(c.currentTime+0.3);}else if(t==='neutral'){o.frequency.setValueAtTime(440,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.35);o.start();o.stop(c.currentTime+0.35);}else if(t==='complete'){o.frequency.setValueAtTime(523,c.currentTime);o.frequency.setValueAtTime(659,c.currentTime+0.15);o.frequency.setValueAtTime(784,c.currentTime+0.3);o.frequency.setValueAtTime(1047,c.currentTime+0.45);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.7);o.start();o.stop(c.currentTime+0.7);}}catch(e){}}
</script>
<script type="text/babel">
const {useState,useEffect}=React;
function sh(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

const GROUPS=[
  {id:'g1',A:{e:'🔴',l:'Red circle'},B:{e:'❤️',l:'Heart'},C:{e:'🍎',l:'Apple'},D:{e:'⭐',l:'Star'},E:{e:'🌀',l:'Swirl'}},
  {id:'g2',A:{e:'🐶',l:'Dog'},      B:{e:'🦮',l:'Guide dog'},C:{e:'🐕',l:'Puppy'},D:{e:'🐱',l:'Cat'},E:{e:'🐸',l:'Frog'}},
  {id:'g3',A:{e:'☀️',l:'Sun'},      B:{e:'🌞',l:'Sun face'}, C:{e:'💛',l:'Yellow'},D:{e:'🌧️',l:'Rain'},E:{e:'❄️',l:'Snow'}},
];

const TRAIN_MAX=9;
const TEST_MAX=3;

function Cell({item,highlight,correct,wrong,blank}){
  const base={display:'inline-flex',alignItems:'center',justifyContent:'center',
    width:'64px',height:'64px',borderRadius:'0.8rem',fontSize:'2rem'};
  if(blank)return<div style={{...base,border:'2px dashed rgba(96,165,250,0.5)',background:'rgba(96,165,250,0.07)',color:'#60a5fa',fontFamily:'Fredoka',fontWeight:700,fontSize:'1.5rem'}}>?</div>;
  let bd='2px solid rgba(255,255,255,0.12)',bg='rgba(255,255,255,0.06)';
  if(highlight){bd='2px solid #60a5fa';bg='rgba(96,165,250,0.12)';}
  if(correct){bd='2px solid #34d399';bg='rgba(52,211,153,0.15)';}
  if(wrong){bd='2px solid #f87171';bg='rgba(248,113,113,0.12)';}
  return<div style={{...base,border:bd,background:bg}}>{item.e}</div>;
}

function EquivTrial({group,targetKey,onDone,num,tot}){
  // targetKey: 'B' or 'C'
  const correct=group[targetKey];
  const [fb,setFb]=useState(null);
  const [opts]=useState(()=>sh([correct,group.D,group.E]));
  const pick=(o)=>{const ok=o.l===correct.l;setFb({ok,o});playTone(ok?'correct':'incorrect');setTimeout(()=>onDone(ok?1:0),1500);};
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem',textAlign:'center'}}>
      <div style={{marginBottom:'0.4rem',color:'#888',fontSize:'0.85rem'}}>Training — {num} / {tot}</div>
      <span className="phase-tag tag-train">A → {targetKey}  ·  Find equivalent</span>
      <div style={{marginBottom:'1rem'}}><Cell item={group.A} highlight/></div>
      <p style={{fontSize:'1.1rem',color:'#ddeeff',marginBottom:'1.8rem'}}>Which means the same as <span style={{color:'#60a5fa',fontFamily:'Fredoka',fontWeight:700}}>{group.A.l}</span>?</p>
      <div style={{display:'flex',gap:'1rem',justifyContent:'center'}}>
        {opts.map((o,i)=>{
          const isCorrect=o.l===correct.l;
          const isWrong=fb&&fb.o.l===o.l&&!fb.ok;
          return(
            <button key={i} onClick={()=>!fb&&pick(o)} disabled={!!fb}
              style={{background:isWrong?'rgba(248,113,113,0.12)':(fb&&isCorrect?'rgba(52,211,153,0.15)':'rgba(96,165,250,0.07)'),
                border:isWrong?'2px solid #f87171':(fb&&isCorrect?'2px solid #34d399':'2px solid rgba(96,165,250,0.25)'),
                borderRadius:'1rem',padding:'0.8rem 1.2rem',cursor:fb?'default':'pointer',textAlign:'center'}}>
              <div style={{fontSize:'2.5rem'}}>{o.e}</div>
              <div style={{fontSize:'0.78rem',color:'#aaa',marginTop:'0.2rem',fontFamily:'Fredoka'}}>{o.l}</div>
            </button>
          );
        })}
      </div>
      {fb&&<p style={{fontSize:'1.1rem',fontFamily:'Fredoka',fontWeight:700,marginTop:'1rem',color:fb.ok?'#34d399':'#f87171'}}>{fb.ok?'✓ Equivalent!':'✗  '+group.A.e+' = '+correct.e}</p>}
    </div>
  );
}

function PatternTrain({group,onDone,num,tot}){
  const pattern=[group.D,group.A,group.D,group.A];
  const [fb,setFb]=useState(null);
  const [opts]=useState(()=>sh([group.A,group.B,group.E]));
  const pick=(o)=>{const ok=o.l===group.A.l;setFb({ok,o});playTone(ok?'correct':'incorrect');setTimeout(()=>onDone(ok?1:0),1500);};
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem',textAlign:'center'}}>
      <div style={{marginBottom:'0.4rem',color:'#888',fontSize:'0.85rem'}}>Training — {num} / {tot}</div>
      <span className="phase-tag tag-train">D-A Pattern  ·  What goes next?</span>
      <div style={{display:'flex',gap:'0.5rem',alignItems:'center',marginBottom:'1.5rem',flexWrap:'wrap',justifyContent:'center'}}>
        {pattern.map((p,i)=><Cell key={i} item={p}/>)}
        <Cell blank/>
      </div>
      <p style={{fontSize:'1.1rem',color:'#ddeeff',marginBottom:'1.8rem'}}>What comes next?</p>
      <div style={{display:'flex',gap:'1rem',justifyContent:'center'}}>
        {opts.map((o,i)=>{
          const isCorrect=o.l===group.A.l;
          const isWrong=fb&&fb.o.l===o.l&&!fb.ok;
          return(
            <button key={i} onClick={()=>!fb&&pick(o)} disabled={!!fb}
              style={{background:isWrong?'rgba(248,113,113,0.12)':(fb&&isCorrect?'rgba(52,211,153,0.15)':'rgba(96,165,250,0.07)'),
                border:isWrong?'2px solid #f87171':(fb&&isCorrect?'2px solid #34d399':'2px solid rgba(96,165,250,0.25)'),
                borderRadius:'1rem',padding:'0.8rem 1.2rem',cursor:fb?'default':'pointer',textAlign:'center'}}>
              <div style={{fontSize:'2.5rem'}}>{o.e}</div>
              <div style={{fontSize:'0.78rem',color:'#aaa',marginTop:'0.2rem',fontFamily:'Fredoka'}}>{o.l}</div>
            </button>
          );
        })}
      </div>
      {fb&&<p style={{fontSize:'1.1rem',fontFamily:'Fredoka',fontWeight:700,marginTop:'1rem',color:fb.ok?'#34d399':'#f87171'}}>{fb.ok?'✓ Correct!':'✗  Repeats: '+group.D.e+'-'+group.A.e}</p>}
    </div>
  );
}

function PatternTest({group,onDone,num,tot}){
  const pattern=[group.D,group.C,group.D,group.C];
  const [fb,setFb]=useState(null);
  const [opts]=useState(()=>sh([group.B,group.D,group.E]));
  const pick=(o)=>{const ok=o.l===group.B.l;setFb({ok,o});playTone('neutral');setTimeout(()=>onDone(ok?1:0),1800);};
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem',textAlign:'center'}}>
      <div style={{marginBottom:'0.4rem',color:'#888',fontSize:'0.85rem'}}>Test — {num} / {tot}</div>
      <span className="phase-tag tag-test">D-C Pattern  ✨  What goes next?</span>
      <div style={{display:'flex',gap:'0.5rem',alignItems:'center',marginBottom:'1rem',flexWrap:'wrap',justifyContent:'center'}}>
        {pattern.map((p,i)=><div key={i} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:'64px',height:'64px',borderRadius:'0.8rem',fontSize:'2rem',border:'2px solid rgba(52,211,153,0.3)',background:'rgba(52,211,153,0.05)'}}>{p.e}</div>)}
        <div style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:'64px',height:'64px',borderRadius:'0.8rem',fontSize:'1.5rem',border:'2px dashed #34d399',background:'rgba(52,211,153,0.07)',color:'#34d399',fontFamily:'Fredoka',fontWeight:700}}>?</div>
      </div>
      <p style={{fontSize:'0.9rem',color:'#60a5fa',marginBottom:'1.5rem',fontFamily:'Fredoka'}}>
        Remember: {group.C.e} = {group.A.e} = {group.B.e}
      </p>
      <p style={{fontSize:'1.1rem',color:'#ddeeff',marginBottom:'1.5rem'}}>What comes next?</p>
      <div style={{display:'flex',gap:'1rem',justifyContent:'center'}}>
        {opts.map((o,i)=>{
          const isCorrect=o.l===group.B.l;
          const isWrong=fb&&fb.o.l===o.l&&!fb.ok;
          return(
            <button key={i} onClick={()=>!fb&&pick(o)} disabled={!!fb}
              style={{background:isWrong?'rgba(248,113,113,0.08)':(fb&&isCorrect?'rgba(52,211,153,0.15)':'rgba(52,211,153,0.06)'),
                border:isWrong?'3px solid rgba(248,113,113,0.4)':(fb&&isCorrect?'3px solid #34d399':'2px solid rgba(52,211,153,0.22)'),
                borderRadius:'1rem',padding:'0.8rem 1.2rem',cursor:fb?'default':'pointer',textAlign:'center'}}>
              <div style={{fontSize:'2.5rem'}}>{o.e}</div>
              <div style={{fontSize:'0.78rem',color:'#aaa',marginTop:'0.2rem',fontFamily:'Fredoka'}}>{o.l}</div>
            </button>
          );
        })}
      </div>
      {fb&&<p style={{fontSize:'1rem',fontFamily:'Fredoka',fontWeight:600,color:'#718096',marginTop:'1rem'}}>Response recorded ✓</p>}
    </div>
  );
}

function buildTrainTrials(){
  const rows=[];
  sh([...GROUPS]).forEach(g=>{
    rows.push({type:'ab',group:g});
    rows.push({type:'ac',group:g});
    rows.push({type:'pat',group:g});
  });
  return rows;
}

function Gate({ts,tm,onRetry,onAdvance}){
  const pct=Math.round((ts/tm)*100),ok=pct>=70;
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem',textAlign:'center'}}>
      <div style={{fontSize:'4rem',marginBottom:'1rem'}}>{ok?'⭐':'💪'}</div>
      <h2 style={{fontSize:'1.8rem',color:'#60a5fa',marginBottom:'1rem'}}>Training Complete!</h2>
      <p style={{color:'#ddeeff',fontSize:'1.2rem'}}>{ts} / {tm} ({pct}%)</p>
      <p style={{color:'#aaa',fontSize:'0.95rem',marginTop:'0.4rem'}}>{ok?'A new pattern appears — complete it with the equivalent you haven\'t seen in that pattern yet!':'Keep practicing!'}</p>
      {ok?<button onClick={onAdvance} style={{padding:'1rem 2.5rem',fontSize:'1.3rem',fontFamily:'Fredoka',background:'#34d399',color:'#060d1a',border:'none',borderRadius:'1rem',cursor:'pointer',fontWeight:700,marginTop:'1.5rem'}}>Start Test →</button>
         :<button onClick={onRetry} style={{padding:'1rem 2.5rem',fontSize:'1.3rem',fontFamily:'Fredoka',background:'#60a5fa',color:'#060d1a',border:'none',borderRadius:'1rem',cursor:'pointer',fontWeight:700,marginTop:'1.5rem'}}>Try Again 🔄</button>}
    </div>
  );
}

function Results({ts,tm,xs,xm}){
  const mastery=(xs/xm)>=0.7;
  useEffect(()=>{
    playTone('complete');
    var _ts=ts,_xs=xs,_m=mastery;
    if(window.FrameShift)window.FrameShift.saveSession('p12u',_ts,tm,_xs,xm,_m);
  },[]);
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem',textAlign:'center'}}>
      <div style={{fontSize:'5rem',marginBottom:'1rem'}}>{mastery?'🏆':'🌟'}</div>
      <h2 style={{fontSize:'2rem',color:'#60a5fa',marginBottom:'1.5rem'}}>Results</h2>
      <div style={{background:'rgba(96,165,250,0.08)',borderRadius:'1rem',padding:'1.4rem 2rem',marginBottom:'0.8rem',minWidth:'230px'}}>
        <h3 style={{color:'#60a5fa',fontFamily:'Fredoka',marginBottom:'0.3rem',fontSize:'1rem'}}>Training (A→B + A→C + Pattern)</h3>
        <p style={{fontSize:'1.4rem',fontFamily:'Fredoka',fontWeight:700}}>{ts} / {tm}</p>
      </div>
      <div style={{background:'rgba(52,211,153,0.1)',borderRadius:'1rem',padding:'1.4rem 2rem',marginBottom:'1.4rem',minWidth:'230px'}}>
        <h3 style={{color:'#34d399',fontFamily:'Fredoka',marginBottom:'0.3rem',fontSize:'1rem'}}>Test (D-C→B emergent!)</h3>
        <p style={{fontSize:'1.4rem',fontFamily:'Fredoka',fontWeight:700}}>{xs} / {xm}</p>
      </div>
      {mastery&&<div style={{fontSize:'1.2rem',color:'#ffbe0b',fontFamily:'Fredoka',fontWeight:700,marginBottom:'1.2rem'}}>🎖️ MASTERY — Equivalence Achieved! 🎖️</div>}
      <div style={{display:'flex',gap:'1rem',flexWrap:'wrap',justifyContent:'center'}}>
        <button onClick={()=>window.location.reload()} style={{padding:'0.8rem 2rem',fontSize:'1.1rem',fontFamily:'Fredoka',background:'#60a5fa',color:'#060d1a',border:'none',borderRadius:'0.8rem',cursor:'pointer',fontWeight:600}}>Play Again</button>
        <a href="index.html" style={{padding:'0.8rem 2rem',fontSize:'1.1rem',fontFamily:'Fredoka',background:'rgba(255,255,255,0.08)',color:'#ddeeff',border:'2px solid rgba(255,255,255,0.18)',borderRadius:'0.8rem',textDecoration:'none',display:'inline-block',fontWeight:600}}>← Back to FrameShift</a>
      </div>
    </div>
  );
}

function App(){
  const [ph,setPh]=useState('welcome');
  const [trials,setTrials]=useState([]);
  const [testItems,setTestItems]=useState([]);
  const [idx,setIdx]=useState(0);
  const [ts,setTs]=useState(0);
  const [xs,setXs]=useState(0);

  const startTrain=()=>{setTrials(buildTrainTrials());setIdx(0);setTs(0);setPh('train');};
  const startTest=()=>{setTestItems(sh([...GROUPS]));setIdx(0);setXs(0);setPh('test');};

  const onTrain=(s)=>{setTs(v=>v+s);idx<trials.length-1?setTimeout(()=>setIdx(i=>i+1),300):setTimeout(()=>setPh('gate'),300);};
  const onTest=(s)=>{setXs(v=>v+s);idx<testItems.length-1?setTimeout(()=>setIdx(i=>i+1),300):setTimeout(()=>setPh('results'),300);};

  if(ph==='welcome')return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem',textAlign:'center'}}>
      <div style={{fontSize:'3.5rem',marginBottom:'0.8rem'}}>🔄</div>
      <h1 style={{fontSize:'2.5rem',color:'#60a5fa',marginBottom:'0.5rem'}}>Pattern Swap</h1>
      <p style={{fontSize:'1.05rem',color:'#ddeeff',marginBottom:'1.5rem',maxWidth:'440px',lineHeight:'1.6'}}>
        Learn which things are equivalent — they can swap places in a pattern. Then complete a pattern using an equivalent you've never seen in that position!
      </p>
      <div style={{display:'flex',gap:'0.5rem',alignItems:'center',marginBottom:'1.5rem',justifyContent:'center',flexWrap:'wrap'}}>
        {[{e:'🔴'},{e:'⭐'},{e:'🔴'},{e:'⭐'}].map((p,i)=>(
          <div key={i} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:'56px',height:'56px',borderRadius:'0.8rem',fontSize:'1.8rem',border:'2px solid rgba(255,255,255,0.12)',background:'rgba(255,255,255,0.06)'}}>{p.e}</div>
        ))}
        <div style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:'56px',height:'56px',borderRadius:'0.8rem',fontSize:'1.4rem',border:'2px dashed rgba(96,165,250,0.5)',background:'rgba(96,165,250,0.07)',color:'#60a5fa',fontFamily:'Fredoka',fontWeight:700}}>?</div>
      </div>
      <p style={{color:'#60a5fa',fontFamily:'Fredoka',fontSize:'1rem',marginBottom:'2rem'}}>🔴 = ❤️ = 🍎 — any could go next!</p>
      <button onClick={startTrain} style={{padding:'1rem 3rem',fontSize:'1.4rem',fontFamily:'Fredoka',background:'#60a5fa',color:'#060d1a',border:'none',borderRadius:'1rem',cursor:'pointer',fontWeight:700,boxShadow:'0 4px 20px rgba(96,165,250,0.4)'}}>Let's Swap! 🔄</button>
    </div>
  );
  if(ph==='train'&&trials.length>0){
    const t=trials[idx];
    if(t.type==='ab')return<EquivTrial key={'ab'+idx} group={t.group} targetKey="B" onDone={onTrain} num={idx+1} tot={trials.length}/>;
    if(t.type==='ac')return<EquivTrial key={'ac'+idx} group={t.group} targetKey="C" onDone={onTrain} num={idx+1} tot={trials.length}/>;
    if(t.type==='pat')return<PatternTrain key={'pt'+idx} group={t.group} onDone={onTrain} num={idx+1} tot={trials.length}/>;
  }
  if(ph==='gate')return<Gate ts={ts} tm={TRAIN_MAX} onRetry={startTrain} onAdvance={startTest}/>;
  if(ph==='test'&&testItems.length>0)return<PatternTest key={'test'+idx} group={testItems[idx]} onDone={onTest} num={idx+1} tot={testItems.length}/>;
  if(ph==='results')return<Results ts={ts} tm={TRAIN_MAX} xs={xs} xm={TEST_MAX}/>;
  return null;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
