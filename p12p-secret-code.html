<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrameShift — Secret Code</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:#120a1e;color:#f0d6ff;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Fredoka',sans-serif}
.frameshift-back{position:fixed;top:16px;left:16px;z-index:100;text-decoration:none;color:#c084fc;font-family:'Fredoka',sans-serif;font-size:1.1rem;opacity:0.8;transition:opacity 0.2s}
.frameshift-back:hover{opacity:1}
.phase-tag{display:inline-block;padding:3px 14px;border-radius:10px;font-size:0.75rem;font-family:'Fredoka',sans-serif;font-weight:700;margin-bottom:10px}
.tag-ab{background:rgba(192,132,252,0.18);color:#c084fc;border:1px solid #c084fc}
.tag-bc{background:rgba(244,114,182,0.18);color:#f472b6;border:1px solid #f472b6}
.tag-ca{background:rgba(52,211,153,0.18);color:#34d399;border:1px solid #34d399}
.sym{font-size:2.2rem;font-family:'Fredoka',sans-serif;letter-spacing:0}
</style>
</head>
<body>
<a href="index.html" class="frameshift-back">← FrameShift</a>
<div id="root"></div>
<script>
window.FrameShift={STORAGE_KEY:"frameshift_progress",load:function(){try{var d=localStorage.getItem(this.STORAGE_KEY);return d?JSON.parse(d):{};}catch(e){return{};}},save:function(d){try{localStorage.setItem(this.STORAGE_KEY,JSON.stringify(d));}catch(e){}},saveSession:function(p,ts,tm,xs,xm,m){var d=this.load();if(!d[p])d[p]={sessions:[]};d[p].sessions.push({date:new Date().toISOString(),train:{score:ts,max:tm},test:xs!==null?{score:xs,max:xm}:null,mastery:m||false});if(m)d[p].mastered=true;this.save(d);}};
var ac_ctx=null;function ac(){if(!ac_ctx)ac_ctx=new(window.AudioContext||window.webkitAudioContext)();return ac_ctx;}
function playTone(t){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0.12,c.currentTime);if(t==='correct'){o.frequency.setValueAtTime(523,c.currentTime);o.frequency.setValueAtTime(659,c.currentTime+0.1);o.frequency.setValueAtTime(784,c.currentTime+0.2);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.4);o.start();o.stop(c.currentTime+0.4);}else if(t==='incorrect'){o.frequency.setValueAtTime(200,c.currentTime);o.frequency.setValueAtTime(180,c.currentTime+0.15);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.3);o.start();o.stop(c.currentTime+0.3);}else if(t==='neutral'){o.frequency.setValueAtTime(440,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.35);o.start();o.stop(c.currentTime+0.35);}else if(t==='complete'){o.frequency.setValueAtTime(523,c.currentTime);o.frequency.setValueAtTime(659,c.currentTime+0.15);o.frequency.setValueAtTime(784,c.currentTime+0.3);o.frequency.setValueAtTime(1047,c.currentTime+0.45);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.7);o.start();o.stop(c.currentTime+0.7);}}catch(e){}}
</script>
<script type="text/babel">
const {useState,useEffect}=React;
function sh(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

// A=picture, B=symbol (arbitrary), C=non-word
const PAIRS=[
  {A:'🐱', Adesc:'cat',   B:'≋', C:'zoc'},
  {A:'🌳', Adesc:'tree',  B:'⊤', C:'queb'},
  {A:'🪆', Adesc:'doll',  B:'⊛', C:'joff'},
  {A:'🐶', Adesc:'dog',   B:'◬', C:'vren'},
  {A:'⭐', Adesc:'star',  B:'⌘', C:'plib'},
  {A:'🚗', Adesc:'car',   B:'⊠', C:'dax'},
  {A:'🍎', Adesc:'apple', B:'⊕', C:'muth'},
  {A:'🐟', Adesc:'fish',  B:'⋈', C:'fenk'},
  {A:'🌙', Adesc:'moon',  B:'⊙', C:'goll'},
];
let SESSION=[];
function pickSubset(arr,k){return sh([...arr]).slice(0,k);}
const ALL_A=PAIRS.map(p=>({A:p.A,Adesc:p.Adesc,id:p.C}));
const ALL_B=PAIRS.map(p=>({B:p.B,id:p.C}));
const TRAIN_MAX=6;  // 3×AB + 3×BC
const TEST_MAX=6;   // 3×CA + 3×CB

function buildTrainTrials(){
  const ab=sh([...SESSION]).map(p=>({type:'ab',pair:p}));
  const bc=sh([...SESSION]).map(p=>({type:'bc',pair:p}));
  return [...ab,...bc];
}
function buildTestTrials(){
  const ca=sh([...SESSION]).map(p=>({type:'ca',pair:p}));
  const cb=sh([...SESSION]).map(p=>({type:'cb',pair:p}));
  return sh([...ca,...cb]);
}

function Welcome({onStart}){
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem',textAlign:'center'}}>
      <div style={{fontSize:'3.5rem',marginBottom:'0.8rem'}}>🔐</div>
      <h1 style={{fontSize:'2.5rem',color:'#c084fc',marginBottom:'0.5rem'}}>Secret Code</h1>
      <div style={{fontSize:'1.6rem',marginBottom:'1rem',letterSpacing:'4px',color:'#f0d6ff'}}>🐱 = ≋ = <span style={{color:'#f472b6',fontFamily:'Fredoka'}}>zoc</span></div>
      <p style={{fontSize:'1.05rem',color:'#f0d6ff',marginBottom:'2rem',maxWidth:'440px',lineHeight:'1.6'}}>
        Every picture has a secret symbol — and every symbol has a secret word. Learn the code, then decode messages you were never taught!
      </p>
      <button onClick={onStart} style={{padding:'1rem 3rem',fontSize:'1.4rem',fontFamily:'Fredoka',background:'#c084fc',color:'#120a1e',border:'none',borderRadius:'1rem',cursor:'pointer',fontWeight:700,boxShadow:'0 4px 20px rgba(192,132,252,0.4)'}}>
        Crack the Code! 🔐
      </button>
    </div>
  );
}

function ABTrial({pair,onDone,num,tot}){
  const [fb,setFb]=useState(null);
  const [opts]=useState(()=>sh(SESSION.map(p=>({B:p.B,id:p.C}))));
  const pick=(o)=>{const ok=o.id===pair.C;setFb({ok,o});playTone(ok?'correct':'incorrect');setTimeout(()=>onDone(ok?1:0),1500);};
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem',textAlign:'center'}}>
      <div style={{marginBottom:'0.4rem',color:'#888',fontSize:'0.85rem'}}>Training — {num} / {tot}</div>
      <span className="phase-tag tag-ab">Picture → Symbol  (A→B)</span>
      <div style={{fontSize:'5.5rem',marginBottom:'0.5rem'}}>{pair.A}</div>
      <p style={{fontSize:'1.2rem',color:'#f0d6ff',marginBottom:'1.8rem'}}>Which secret symbol goes with <span style={{color:'#c084fc',fontFamily:'Fredoka',fontWeight:700}}>{pair.Adesc}</span>?</p>
      <div style={{display:'flex',gap:'1.5rem',flexWrap:'wrap',justifyContent:'center'}}>
        {opts.map((o,i)=>{
          let bg='rgba(192,132,252,0.07)',bd='2px solid rgba(192,132,252,0.28)';
          if(fb){if(o.id===pair.C){bg='rgba(52,211,153,0.15)';bd='2px solid #34d399';}
            else if(fb.o.id===o.id&&!fb.ok){bg='rgba(248,113,113,0.12)';bd='2px solid #f87171';}}
          return<button key={i} onClick={()=>!fb&&pick(o)} disabled={!!fb}
            style={{background:bg,border:bd,borderRadius:'0.8rem',padding:'1.2rem 2rem',cursor:fb?'default':'pointer',
              fontSize:'2rem',fontFamily:'Fredoka',color:'#f0d6ff',fontWeight:700,minWidth:'80px'}}>{o.B}</button>;
        })}
      </div>
      {fb&&<p style={{fontSize:'1.1rem',fontFamily:'Fredoka',fontWeight:700,marginTop:'1rem',color:fb.ok?'#34d399':'#f87171'}}>{fb.ok?'✓ Correct!':'✗  '+pair.Adesc+' → '+pair.B}</p>}
    </div>
  );
}

function BCTrial({pair,onDone,num,tot}){
  const [fb,setFb]=useState(null);
  const [opts]=useState(()=>sh(SESSION.map(p=>p.C)));
  const pick=(o)=>{const ok=o===pair.C;setFb({ok,o});playTone(ok?'correct':'incorrect');setTimeout(()=>onDone(ok?1:0),1500);};
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem',textAlign:'center'}}>
      <div style={{marginBottom:'0.4rem',color:'#888',fontSize:'0.85rem'}}>Training — {num} / {tot}</div>
      <span className="phase-tag tag-bc">Symbol → Code Word  (B→C)</span>
      <div style={{fontSize:'3.5rem',fontFamily:'Fredoka',color:'#c084fc',marginBottom:'0.5rem',letterSpacing:'2px'}}>{pair.B}</div>
      <p style={{fontSize:'1.2rem',color:'#f0d6ff',marginBottom:'1.8rem'}}>Which code word matches this symbol?</p>
      <div style={{display:'flex',gap:'1rem',flexWrap:'wrap',justifyContent:'center'}}>
        {opts.map((o,i)=>{
          let bg='rgba(244,114,182,0.07)',bd='2px solid rgba(244,114,182,0.28)';
          if(fb){if(o===pair.C){bg='rgba(52,211,153,0.15)';bd='2px solid #34d399';}
            else if(fb.o===o&&!fb.ok){bg='rgba(248,113,113,0.12)';bd='2px solid #f87171';}}
          return<button key={i} onClick={()=>!fb&&pick(o)} disabled={!!fb}
            style={{background:bg,border:bd,borderRadius:'0.8rem',padding:'0.85rem 2.2rem',cursor:fb?'default':'pointer',
              fontSize:'1.4rem',fontFamily:'Fredoka',color:'#f0d6ff',fontWeight:700}}>{o}</button>;
        })}
      </div>
      {fb&&<p style={{fontSize:'1.1rem',fontFamily:'Fredoka',fontWeight:700,marginTop:'1rem',color:fb.ok?'#34d399':'#f87171'}}>{fb.ok?'✓ Correct!':'✗  '+pair.B+' → '+pair.C}</p>}
    </div>
  );
}

// C→A: show code word, pick picture (emergent)
function CATrial({pair,onDone,num,tot}){
  const [fb,setFb]=useState(null);
  const [opts]=useState(()=>sh(SESSION.map(p=>({A:p.A,Adesc:p.Adesc,id:p.C}))));
  const pick=(o)=>{const ok=o.id===pair.C;setFb({ok,o});playTone('neutral');setTimeout(()=>onDone(ok?1:0),1800);};
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem',textAlign:'center'}}>
      <div style={{marginBottom:'0.4rem',color:'#888',fontSize:'0.85rem'}}>Test — {num} / {tot}</div>
      <span className="phase-tag tag-ca">Code Word → Picture  ✨  (C→A)</span>
      <p style={{fontSize:'3.5rem',color:'#f472b6',fontFamily:'Fredoka',fontWeight:700,marginBottom:'0.5rem'}}>{pair.C}</p>
      <p style={{fontSize:'1.2rem',color:'#f0d6ff',marginBottom:'1.8rem'}}>Which picture does this code word mean?</p>
      <div style={{display:'flex',gap:'1.2rem',flexWrap:'wrap',justifyContent:'center'}}>
        {opts.map((o,i)=>{
          let bg='rgba(52,211,153,0.06)',bd='2px solid rgba(52,211,153,0.22)';
          if(fb){if(o.id===pair.C){bg='rgba(52,211,153,0.15)';bd='3px solid #34d399';}
            else if(fb.o.id===o.id&&!fb.ok){bg='rgba(248,113,113,0.08)';bd='3px solid rgba(248,113,113,0.4)';}}
          return(
            <button key={i} onClick={()=>!fb&&pick(o)} disabled={!!fb}
              style={{background:bg,border:bd,borderRadius:'1rem',padding:'1rem 1.5rem',cursor:fb?'default':'pointer',textAlign:'center'}}>
              <div style={{fontSize:'3rem'}}>{o.A}</div>
              <div style={{fontSize:'0.85rem',color:'#aaa',marginTop:'0.3rem'}}>{o.Adesc}</div>
            </button>
          );
        })}
      </div>
      {fb&&<p style={{fontSize:'1rem',fontFamily:'Fredoka',fontWeight:600,color:'#718096',marginTop:'1rem'}}>Response recorded ✓</p>}
    </div>
  );
}

// C→B: show code word, pick symbol (emergent)
function CBTrial({pair,onDone,num,tot}){
  const [fb,setFb]=useState(null);
  const [opts]=useState(()=>sh(SESSION.map(p=>({B:p.B,id:p.C}))));
  const pick=(o)=>{const ok=o.id===pair.C;setFb({ok,o});playTone('neutral');setTimeout(()=>onDone(ok?1:0),1800);};
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem',textAlign:'center'}}>
      <div style={{marginBottom:'0.4rem',color:'#888',fontSize:'0.85rem'}}>Test — {num} / {tot}</div>
      <span className="phase-tag tag-ca">Code Word → Symbol  ✨  (C→B)</span>
      <p style={{fontSize:'3.5rem',color:'#f472b6',fontFamily:'Fredoka',fontWeight:700,marginBottom:'0.5rem'}}>{pair.C}</p>
      <p style={{fontSize:'1.2rem',color:'#f0d6ff',marginBottom:'1.8rem'}}>Which symbol does this code word mean?</p>
      <div style={{display:'flex',gap:'1.5rem',flexWrap:'wrap',justifyContent:'center'}}>
        {opts.map((o,i)=>{
          let bg='rgba(52,211,153,0.06)',bd='2px solid rgba(52,211,153,0.22)';
          if(fb){if(o.id===pair.C){bg='rgba(52,211,153,0.15)';bd='3px solid #34d399';}
            else if(fb.o.id===o.id&&!fb.ok){bg='rgba(248,113,113,0.08)';bd='3px solid rgba(248,113,113,0.4)';}}
          return<button key={i} onClick={()=>!fb&&pick(o)} disabled={!!fb}
            style={{background:bg,border:bd,borderRadius:'0.8rem',padding:'1.2rem 2rem',cursor:fb?'default':'pointer',
              fontSize:'2rem',fontFamily:'Fredoka',color:'#f0d6ff',fontWeight:700,minWidth:'80px'}}>{o.B}</button>;
        })}
      </div>
      {fb&&<p style={{fontSize:'1rem',fontFamily:'Fredoka',fontWeight:600,color:'#718096',marginTop:'1rem'}}>Response recorded ✓</p>}
    </div>
  );
}

function Gate({trainScore,trainMax,onRetry,onAdvance}){
  const pct=Math.round((trainScore/trainMax)*100),ok=pct>=70;
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem',textAlign:'center'}}>
      <div style={{fontSize:'4rem',marginBottom:'1rem'}}>{ok?'⭐':'💪'}</div>
      <h2 style={{fontSize:'1.8rem',color:'#c084fc',marginBottom:'1rem'}}>Training Complete!</h2>
      <p style={{color:'#f0d6ff',fontSize:'1.2rem'}}>{trainScore} / {trainMax} ({pct}%)</p>
      <p style={{color:'#aaa',fontSize:'0.95rem',marginTop:'0.4rem'}}>{ok?'Now decode messages you were never taught!':'Let\'s review the code!'}</p>
      {ok?<button onClick={onAdvance} style={{padding:'1rem 2.5rem',fontSize:'1.3rem',fontFamily:'Fredoka',background:'#34d399',color:'#120a1e',border:'none',borderRadius:'1rem',cursor:'pointer',fontWeight:700,marginTop:'1.5rem'}}>Start Decoding! 🔐</button>
         :<button onClick={onRetry} style={{padding:'1rem 2.5rem',fontSize:'1.3rem',fontFamily:'Fredoka',background:'#c084fc',color:'#120a1e',border:'none',borderRadius:'1rem',cursor:'pointer',fontWeight:700,marginTop:'1.5rem'}}>Try Again 🔄</button>}
    </div>
  );
}

function Results({trainScore,trainMax,testScore,testMax}){
  const mastery=(testScore/testMax)>=0.7;
  useEffect(()=>{
    playTone('complete');
    var _ts=trainScore,_xs=testScore,_m=mastery;
    if(window.FrameShift)window.FrameShift.saveSession('p12p',_ts,trainMax,_xs,testMax,_m);
  },[]);
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem',textAlign:'center'}}>
      <div style={{fontSize:'5rem',marginBottom:'1rem'}}>{mastery?'🏆':'🌟'}</div>
      <h2 style={{fontSize:'2rem',color:'#c084fc',marginBottom:'1.5rem'}}>Results</h2>
      <div style={{background:'rgba(192,132,252,0.08)',borderRadius:'1rem',padding:'1.4rem 2rem',marginBottom:'0.8rem',minWidth:'230px'}}>
        <h3 style={{color:'#c084fc',fontFamily:'Fredoka',marginBottom:'0.3rem',fontSize:'1rem'}}>Training (A→B + B→C)</h3>
        <p style={{fontSize:'1.4rem',fontFamily:'Fredoka',fontWeight:700}}>{trainScore} / {trainMax}</p>
      </div>
      <div style={{background:'rgba(52,211,153,0.1)',borderRadius:'1rem',padding:'1.4rem 2rem',marginBottom:'1.4rem',minWidth:'230px'}}>
        <h3 style={{color:'#34d399',fontFamily:'Fredoka',marginBottom:'0.3rem',fontSize:'1rem'}}>Test (C→A + C→B emergent!)</h3>
        <p style={{fontSize:'1.4rem',fontFamily:'Fredoka',fontWeight:700}}>{testScore} / {testMax}</p>
      </div>
      {mastery&&<div style={{fontSize:'1.2rem',color:'#ffbe0b',fontFamily:'Fredoka',fontWeight:700,marginBottom:'1.2rem'}}>🎖️ MASTERY — Equivalence Achieved! 🎖️</div>}
      <div style={{display:'flex',gap:'1rem',flexWrap:'wrap',justifyContent:'center'}}>
        <button onClick={()=>window.location.reload()} style={{padding:'0.8rem 2rem',fontSize:'1.1rem',fontFamily:'Fredoka',background:'#c084fc',color:'#120a1e',border:'none',borderRadius:'0.8rem',cursor:'pointer',fontWeight:600}}>Play Again</button>
        <a href="index.html" style={{padding:'0.8rem 2rem',fontSize:'1.1rem',fontFamily:'Fredoka',background:'rgba(255,255,255,0.08)',color:'#f0d6ff',border:'2px solid rgba(255,255,255,0.18)',borderRadius:'0.8rem',textDecoration:'none',display:'inline-block',fontWeight:600}}>← Back to FrameShift</a>
      </div>
    </div>
  );
}

function App(){
  const [ph,setPh]=useState('welcome');
  const [trials,setTrials]=useState([]);
  const [testTrials,setTestTrials]=useState([]);
  const [idx,setIdx]=useState(0);
  const [trainScore,setTrainScore]=useState(0);
  const [testScore,setTestScore]=useState(0);

  const startTrain=()=>{SESSION=pickSubset(PAIRS,3);setTrials(buildTrainTrials());setIdx(0);setTrainScore(0);setPh('train');};
  const startTest=()=>{setTestTrials(buildTestTrials());setIdx(0);setTestScore(0);setPh('test');};

  const onTrain=(s)=>{
    setTrainScore(v=>v+s);
    if(idx<trials.length-1)setTimeout(()=>setIdx(i=>i+1),300);
    else setTimeout(()=>setPh('gate'),300);
  };
  const onTest=(s)=>{
    setTestScore(v=>v+s);
    if(idx<testTrials.length-1)setTimeout(()=>setIdx(i=>i+1),300);
    else setTimeout(()=>setPh('results'),300);
  };

  if(ph==='welcome')return<Welcome onStart={startTrain}/>;
  if(ph==='train'&&trials.length>0){
    const t=trials[idx];
    if(t.type==='ab')return<ABTrial key={'ab'+idx} pair={t.pair} onDone={onTrain} num={idx+1} tot={trials.length}/>;
    if(t.type==='bc')return<BCTrial key={'bc'+idx} pair={t.pair} onDone={onTrain} num={idx+1} tot={trials.length}/>;
  }
  if(ph==='gate')return<Gate trainScore={trainScore} trainMax={TRAIN_MAX} onRetry={startTrain} onAdvance={startTest}/>;
  if(ph==='test'&&testTrials.length>0){
    const t=testTrials[idx];
    if(t.type==='ca')return<CATrial key={'ca'+idx} pair={t.pair} onDone={onTest} num={idx+1} tot={testTrials.length}/>;
    if(t.type==='cb')return<CBTrial key={'cb'+idx} pair={t.pair} onDone={onTest} num={idx+1} tot={testTrials.length}/>;
  }
  if(ph==='results')return<Results trainScore={trainScore} trainMax={TRAIN_MAX} testScore={testScore} testMax={TEST_MAX}/>;
  return null;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
