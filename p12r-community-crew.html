<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrameShift — Community Crew</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:#0e0a00;color:#fff3d6;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Fredoka',sans-serif}
.frameshift-back{position:fixed;top:16px;left:16px;z-index:100;text-decoration:none;color:#fbbf24;font-family:'Fredoka',sans-serif;font-size:1.1rem;opacity:0.8;transition:opacity 0.2s}
.frameshift-back:hover{opacity:1}
.phase-tag{display:inline-block;padding:3px 14px;border-radius:10px;font-size:0.75rem;font-family:'Fredoka',sans-serif;font-weight:700;margin-bottom:10px}
.tag-train{background:rgba(251,191,36,0.18);color:#fbbf24;border:1px solid #fbbf24}
.tag-test{background:rgba(52,211,153,0.18);color:#34d399;border:1px solid #34d399}
</style>
</head>
<body>
<a href="index.html" class="frameshift-back">← FrameShift</a>
<div id="root"></div>
<script>
window.FrameShift={STORAGE_KEY:"frameshift_progress",load:function(){try{var d=localStorage.getItem(this.STORAGE_KEY);return d?JSON.parse(d):{};}catch(e){return{};}},save:function(d){try{localStorage.setItem(this.STORAGE_KEY,JSON.stringify(d));}catch(e){}},saveSession:function(p,ts,tm,xs,xm,m){var d=this.load();if(!d[p])d[p]={sessions:[]};d[p].sessions.push({date:new Date().toISOString(),train:{score:ts,max:tm},test:xs!==null?{score:xs,max:xm}:null,mastery:m||false});if(m)d[p].mastered=true;this.save(d);}};
var ac_ctx=null;function ac(){if(!ac_ctx)ac_ctx=new(window.AudioContext||window.webkitAudioContext)();return ac_ctx;}
function playTone(t){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0.12,c.currentTime);if(t==='correct'){o.frequency.setValueAtTime(523,c.currentTime);o.frequency.setValueAtTime(659,c.currentTime+0.1);o.frequency.setValueAtTime(784,c.currentTime+0.2);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.4);o.start();o.stop(c.currentTime+0.4);}else if(t==='incorrect'){o.frequency.setValueAtTime(200,c.currentTime);o.frequency.setValueAtTime(180,c.currentTime+0.15);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.3);o.start();o.stop(c.currentTime+0.3);}else if(t==='neutral'){o.frequency.setValueAtTime(440,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.35);o.start();o.stop(c.currentTime+0.35);}else if(t==='complete'){o.frequency.setValueAtTime(523,c.currentTime);o.frequency.setValueAtTime(659,c.currentTime+0.15);o.frequency.setValueAtTime(784,c.currentTime+0.3);o.frequency.setValueAtTime(1047,c.currentTime+0.45);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.7);o.start();o.stop(c.currentTime+0.7);}}catch(e){}}
</script>
<script type="text/babel">
const {useState,useEffect}=React;
function sh(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

const CREWS=[
  {
    id:'police',
    A:{name:'Police Officer', emoji:'👮'},
    B:{name:'Police Station',  emoji:'🏫', type:'location'},
    C:{name:'Helping people',  emoji:'🤝', type:'activity'},
    D:{name:'Police Car',      emoji:'🚓', type:'vehicle'},
    color:'#3b82f6',
  },
  {
    id:'teacher',
    A:{name:'Teacher',   emoji:'👩‍🏫'},
    B:{name:'School',    emoji:'🏫', type:'location'},
    C:{name:'Teaching',  emoji:'📖', type:'activity'},
    D:{name:'School Bus',emoji:'🚌', type:'vehicle'},
    color:'#f59e0b',
  },
  {
    id:'medic',
    A:{name:'Medic',     emoji:'🧑‍⚕️'},
    B:{name:'Hospital',  emoji:'🏥', type:'location'},
    C:{name:'Examining', emoji:'🩺', type:'activity'},
    D:{name:'Ambulance', emoji:'🚑', type:'vehicle'},
    color:'#ef4444',
  },
];

// Training: show A (helper), pick matching B, C, or D from mixed array
// 3 rounds × 3 question types = 9 train trials
function buildTrainTrials(){
  const trials=[];
  ['B','C','D'].forEach(cat=>{
    sh([...CREWS]).forEach(crew=>{
      trials.push({crew,cat});
    });
  });
  return trials;
}

const TRAIN_MAX=9;
const TEST_MAX=12; // 12 cards, each correctly sorted = 1 point

function Welcome({onStart}){
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem',textAlign:'center'}}>
      <div style={{fontSize:'3.5rem',marginBottom:'0.8rem'}}>👮👩‍🏫🧑‍⚕️</div>
      <h1 style={{fontSize:'2.5rem',color:'#fbbf24',marginBottom:'0.5rem'}}>Community Crew</h1>
      <p style={{fontSize:'1.05rem',color:'#fff3d6',marginBottom:'1.8rem',maxWidth:'440px',lineHeight:'1.6'}}>
        Every community helper has a place, a job, and a vehicle. Learn who goes with what — then sort them all!
      </p>
      <div style={{display:'flex',gap:'1.5rem',fontSize:'2rem',marginBottom:'2rem',justifyContent:'center'}}>
        <span>🚓</span><span>🏥</span><span>📖</span><span>🚑</span>
      </div>
      <button onClick={onStart} style={{padding:'1rem 3rem',fontSize:'1.4rem',fontFamily:'Fredoka',background:'#fbbf24',color:'#0e0a00',border:'none',borderRadius:'1rem',cursor:'pointer',fontWeight:700,boxShadow:'0 4px 20px rgba(251,191,36,0.4)'}}>
        Meet the Crew! 👮
      </button>
    </div>
  );
}

function TrainTrial({trial,onDone,num,tot}){
  const {crew,cat}=trial;
  const catLabel={B:'location',C:'activity',D:'vehicle'}[cat];
  const correct=crew[cat];
  // Build options: correct + one from each other crew
  const others=CREWS.filter(c=>c.id!==crew.id);
  const [opts]=useState(()=>sh([correct,...others.map(c=>c[cat])]));
  const [fb,setFb]=useState(null);
  const pick=(o)=>{
    const ok=o.name===correct.name;
    setFb({ok,o});
    playTone(ok?'correct':'incorrect');
    setTimeout(()=>onDone(ok?1:0),1500);
  };
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem',textAlign:'center'}}>
      <div style={{marginBottom:'0.4rem',color:'#888',fontSize:'0.85rem'}}>Training — {num} / {tot}</div>
      <span className="phase-tag tag-train">Helper → {catLabel.charAt(0).toUpperCase()+catLabel.slice(1)}</span>
      <div style={{fontSize:'5rem',marginBottom:'0.3rem'}}>{crew.A.emoji}</div>
      <p style={{fontSize:'1.8rem',color:'#fbbf24',fontFamily:'Fredoka',fontWeight:700,marginBottom:'0.3rem'}}>{crew.A.name}</p>
      <p style={{fontSize:'1.1rem',color:'#fff3d6',marginBottom:'1.8rem'}}>Which <span style={{color:'#fbbf24',fontWeight:700}}>{catLabel}</span> goes with the {crew.A.name}?</p>
      <div style={{display:'flex',gap:'1rem',flexWrap:'wrap',justifyContent:'center'}}>
        {opts.map((o,i)=>{
          let bg='rgba(251,191,36,0.07)',bd='2px solid rgba(251,191,36,0.28)';
          if(fb){if(o.name===correct.name){bg='rgba(52,211,153,0.15)';bd='2px solid #34d399';}
            else if(fb.o.name===o.name&&!fb.ok){bg='rgba(248,113,113,0.12)';bd='2px solid #f87171';}}
          return(
            <button key={i} onClick={()=>!fb&&pick(o)} disabled={!!fb}
              style={{background:bg,border:bd,borderRadius:'1rem',padding:'0.9rem 1.5rem',cursor:fb?'default':'pointer',textAlign:'center',minWidth:'100px'}}>
              <div style={{fontSize:'2.2rem'}}>{o.emoji}</div>
              <div style={{fontSize:'0.9rem',fontFamily:'Fredoka',color:'#fff3d6',marginTop:'0.3rem',fontWeight:600}}>{o.name}</div>
            </button>
          );
        })}
      </div>
      {fb&&<p style={{fontSize:'1.1rem',fontFamily:'Fredoka',fontWeight:700,marginTop:'1rem',color:fb.ok?'#34d399':'#f87171'}}>{fb.ok?'✓ Correct!':'✗  '+crew.A.name+' → '+correct.name}</p>}
    </div>
  );
}

// Test: sorting game — 12 cards, drag (tap) into 3 crew buckets
function SortTest({onDone}){
  // Build all 12 cards: each crew has B, C, D (not A — helper is the bucket label)
  const allCards=[];
  CREWS.forEach(crew=>{
    ['B','C','D'].forEach(cat=>{
      allCards.push({crewId:crew.id,card:crew[cat],cat});
    });
  });
  const [cards]=useState(()=>sh([...allCards]));
  const [sorted,setSorted]=useState({}); // cardIdx → crewId
  const [submitted,setSubmitted]=useState(false);
  const [score,setScore]=useState(null);

  const [selected,setSelected]=useState(null); // index of selected card

  const assign=(cardIdx,crewId)=>{
    if(submitted)return;
    setSorted(s=>({...s,[cardIdx]:crewId}));
    setSelected(null);
    playTone('neutral');
  };

  const submit=()=>{
    let s=0;
    cards.forEach((c,i)=>{if(sorted[i]===c.crewId)s++;});
    setScore(s);
    setSubmitted(true);
    playTone(s>=8?'complete':'incorrect');
    setTimeout(()=>onDone(s),2000);
  };

  const unassigned=cards.filter((_,i)=>sorted[i]===undefined);

  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',minHeight:'100vh',padding:'1.5rem',paddingTop:'3rem'}}>
      <span className="phase-tag tag-test" style={{alignSelf:'center'}}>Sort All Cards!  ✨</span>
      <p style={{color:'#fff3d6',fontSize:'0.95rem',marginBottom:'1.2rem',textAlign:'center'}}>
        {selected!==null?<span style={{color:'#fbbf24',fontFamily:'Fredoka',fontWeight:700}}>Now tap a crew bucket ↓</span>
          :'Tap a card, then tap the matching crew bucket'}
      </p>

      {/* Unassigned card hand */}
      <div style={{display:'flex',gap:'0.6rem',flexWrap:'wrap',justifyContent:'center',marginBottom:'1.5rem',minHeight:'80px'}}>
        {cards.map((c,i)=>sorted[i]!==undefined?null:(
          <button key={i} onClick={()=>setSelected(selected===i?null:i)}
            style={{background:selected===i?'rgba(251,191,36,0.25)':'rgba(255,255,255,0.06)',
              border:selected===i?'2px solid #fbbf24':'2px solid rgba(255,255,255,0.15)',
              borderRadius:'0.8rem',padding:'0.6rem 0.8rem',cursor:'pointer',textAlign:'center',minWidth:'70px'}}>
            <div style={{fontSize:'1.8rem'}}>{c.card.emoji}</div>
            <div style={{fontSize:'0.75rem',color:'#aaa',marginTop:'0.2rem',fontFamily:'Fredoka'}}>{c.card.name}</div>
          </button>
        ))}
        {unassigned.length===0&&!submitted&&(
          <button onClick={submit} style={{padding:'0.8rem 2rem',fontSize:'1.1rem',fontFamily:'Fredoka',background:'#34d399',color:'#0e0a00',border:'none',borderRadius:'0.8rem',cursor:'pointer',fontWeight:700,alignSelf:'center'}}>
            Check Answers ✓
          </button>
        )}
      </div>

      {/* Crew buckets */}
      <div style={{display:'flex',gap:'1rem',flexWrap:'wrap',justifyContent:'center',width:'100%',maxWidth:'680px'}}>
        {CREWS.map(crew=>{
          const assigned=Object.entries(sorted).filter(([,cid])=>cid===crew.id).map(([i])=>cards[parseInt(i)]);
          return(
            <div key={crew.id} onClick={()=>selected!==null&&assign(selected,crew.id)}
              style={{background:`rgba(${crew.id==='police'?'59,130,246':crew.id==='teacher'?'245,158,11':'239,68,68'},0.08)`,
                border:`2px solid ${selected!==null?crew.color:'rgba(255,255,255,0.1)'}`,
                borderRadius:'1rem',padding:'0.8rem',minWidth:'180px',flex:1,cursor:selected!==null?'pointer':'default',
                transition:'border 0.15s'}}>
              <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'0.6rem'}}>
                <span style={{fontSize:'1.8rem'}}>{crew.A.emoji}</span>
                <span style={{fontFamily:'Fredoka',fontSize:'1rem',color:crew.color,fontWeight:700}}>{crew.A.name}</span>
              </div>
              <div style={{display:'flex',gap:'0.4rem',flexWrap:'wrap',minHeight:'50px'}}>
                {assigned.map((c,i)=>{
                  const cardIdx=Object.entries(sorted).find(([,cid])=>cid===crew.id&&cards[parseInt(Object.entries(sorted).filter(([,x])=>x===crew.id)[i]?.[0])]?.card.name===c.card.name)?.[0];
                  const correct=submitted&&c.crewId===crew.id;
                  const wrong=submitted&&c.crewId!==crew.id;
                  return(
                    <div key={i} style={{background:submitted?(correct?'rgba(52,211,153,0.2)':'rgba(248,113,113,0.2)'):'rgba(255,255,255,0.08)',
                      border:submitted?(correct?'1px solid #34d399':'1px solid #f87171'):'1px solid rgba(255,255,255,0.15)',
                      borderRadius:'0.5rem',padding:'0.3rem 0.5rem',textAlign:'center'}}>
                      <div style={{fontSize:'1.3rem'}}>{c.card.emoji}</div>
                      <div style={{fontSize:'0.7rem',color:'#aaa',fontFamily:'Fredoka'}}>{c.card.name}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      {score!==null&&(
        <div style={{marginTop:'1.5rem',textAlign:'center'}}>
          <p style={{fontSize:'1.4rem',fontFamily:'Fredoka',fontWeight:700,color:score>=8?'#34d399':'#fbbf24'}}>
            {score} / 12 sorted correctly
          </p>
        </div>
      )}
    </div>
  );
}

function Gate({trainScore,trainMax,onRetry,onAdvance}){
  const pct=Math.round((trainScore/trainMax)*100),ok=pct>=70;
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem',textAlign:'center'}}>
      <div style={{fontSize:'4rem',marginBottom:'1rem'}}>{ok?'⭐':'💪'}</div>
      <h2 style={{fontSize:'1.8rem',color:'#fbbf24',marginBottom:'1rem'}}>Training Complete!</h2>
      <p style={{color:'#fff3d6',fontSize:'1.2rem'}}>{trainScore} / {trainMax} ({pct}%)</p>
      <p style={{color:'#aaa',fontSize:'0.95rem',marginTop:'0.4rem'}}>{ok?'Now sort ALL the cards into the right crews!':'Let\'s review the crews!'}</p>
      {ok?<button onClick={onAdvance} style={{padding:'1rem 2.5rem',fontSize:'1.3rem',fontFamily:'Fredoka',background:'#34d399',color:'#0e0a00',border:'none',borderRadius:'1rem',cursor:'pointer',fontWeight:700,marginTop:'1.5rem'}}>Sort Time! 🃏</button>
         :<button onClick={onRetry} style={{padding:'1rem 2.5rem',fontSize:'1.3rem',fontFamily:'Fredoka',background:'#fbbf24',color:'#0e0a00',border:'none',borderRadius:'1rem',cursor:'pointer',fontWeight:700,marginTop:'1.5rem'}}>Try Again 🔄</button>}
    </div>
  );
}

function Results({trainScore,trainMax,testScore,testMax}){
  const mastery=(testScore/testMax)>=0.7;
  useEffect(()=>{
    playTone('complete');
    var _ts=trainScore,_xs=testScore,_m=mastery;
    if(window.FrameShift)window.FrameShift.saveSession('p12r',_ts,trainMax,_xs,testMax,_m);
  },[]);
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem',textAlign:'center'}}>
      <div style={{fontSize:'5rem',marginBottom:'1rem'}}>{mastery?'🏆':'🌟'}</div>
      <h2 style={{fontSize:'2rem',color:'#fbbf24',marginBottom:'1.5rem'}}>Results</h2>
      <div style={{background:'rgba(251,191,36,0.08)',borderRadius:'1rem',padding:'1.4rem 2rem',marginBottom:'0.8rem',minWidth:'230px'}}>
        <h3 style={{color:'#fbbf24',fontFamily:'Fredoka',marginBottom:'0.3rem',fontSize:'1rem'}}>Training (A→B/C/D)</h3>
        <p style={{fontSize:'1.4rem',fontFamily:'Fredoka',fontWeight:700}}>{trainScore} / {trainMax}</p>
      </div>
      <div style={{background:'rgba(52,211,153,0.1)',borderRadius:'1rem',padding:'1.4rem 2rem',marginBottom:'1.4rem',minWidth:'230px'}}>
        <h3 style={{color:'#34d399',fontFamily:'Fredoka',marginBottom:'0.3rem',fontSize:'1rem'}}>Sort Test (emergent!)</h3>
        <p style={{fontSize:'1.4rem',fontFamily:'Fredoka',fontWeight:700}}>{testScore} / {testMax}</p>
      </div>
      {mastery&&<div style={{fontSize:'1.2rem',color:'#ffbe0b',fontFamily:'Fredoka',fontWeight:700,marginBottom:'1.2rem'}}>🎖️ MASTERY — Equivalence Achieved! 🎖️</div>}
      <div style={{display:'flex',gap:'1rem',flexWrap:'wrap',justifyContent:'center'}}>
        <button onClick={()=>window.location.reload()} style={{padding:'0.8rem 2rem',fontSize:'1.1rem',fontFamily:'Fredoka',background:'#fbbf24',color:'#0e0a00',border:'none',borderRadius:'0.8rem',cursor:'pointer',fontWeight:600}}>Play Again</button>
        <a href="index.html" style={{padding:'0.8rem 2rem',fontSize:'1.1rem',fontFamily:'Fredoka',background:'rgba(255,255,255,0.08)',color:'#fff3d6',border:'2px solid rgba(255,255,255,0.18)',borderRadius:'0.8rem',textDecoration:'none',display:'inline-block',fontWeight:600}}>← Back to FrameShift</a>
      </div>
    </div>
  );
}

function App(){
  const [ph,setPh]=useState('welcome');
  const [trials,setTrials]=useState([]);
  const [idx,setIdx]=useState(0);
  const [trainScore,setTrainScore]=useState(0);
  const [testScore,setTestScore]=useState(0);

  const startTrain=()=>{setTrials(buildTrainTrials());setIdx(0);setTrainScore(0);setPh('train');};

  const onTrain=(s)=>{
    setTrainScore(v=>v+s);
    if(idx<trials.length-1)setTimeout(()=>setIdx(i=>i+1),300);
    else setTimeout(()=>setPh('gate'),300);
  };
  const onTest=(s)=>{setTestScore(s);setPh('results');};

  if(ph==='welcome')return<Welcome onStart={startTrain}/>;
  if(ph==='train'&&trials.length>0)
    return<TrainTrial key={'t'+idx} trial={trials[idx]} onDone={onTrain} num={idx+1} tot={trials.length}/>;
  if(ph==='gate')return<Gate trainScore={trainScore} trainMax={TRAIN_MAX} onRetry={startTrain} onAdvance={()=>setPh('test')}/>;
  if(ph==='test')return<SortTest onDone={onTest}/>;
  if(ph==='results')return<Results trainScore={trainScore} trainMax={TRAIN_MAX} testScore={testScore} testMax={TEST_MAX}/>;
  return null;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
